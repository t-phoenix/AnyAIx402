# AnyX secrets checklist (EXAMPLE ONLY — no real credentials)
# Copy to config/secrets.local.yaml for local notes if desired.
# Prefer loading runtime secrets from .env.local / Doppler / GitHub Actions.
# NEVER commit files that contain real keys.

version: 1
product: AnyX
notes: >
  Single human-facing map of credentials required across phases.
  Fill .env.local first; keep this file as a checklist.

phases:
  phase_0_foundation:
    required:
      - DATABASE_URL
      - REDIS_URL
    optional: []

  phase_1_mvp_core:
    required:
      - RPC_URL_BASE
      - PRIVATE_KEY          # dev hot signer only
      - FACILITATOR_URL
      - ONEINCH_API_KEY      # may be optional for some read endpoints; set for prod
      - ZEROX_API_KEY
      - FEE_BPS
      - API_SECRET
    optional:
      - FACILITATOR_FALLBACK_URL
      - ANYX_API_KEY

  phase_2_contracts:
    required:
      - RPC_URL_BASE_SEPOLIA
      - BASESCAN_API_KEY
      - ANYX_ROUTER          # after deploy
      - FEE_COLLECTOR
    optional:
      - RESERVE_POOL

  phase_3_cross_chain:
    required:
      - CCTP_ATTESTER_URL
      - RPC_URL_ETHEREUM
      - RPC_URL_SOLANA
      - RESERVE_POOL
    optional: []

  phase_4_lightning:
    required:
      - LND_TLS_CERT_PATH
      - LND_MACAROON_PATH
    optional:
      - LNC_CONNECTION_STRING

  phase_6_billing:
    required:
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PRO_PRICE_ID
    optional: []

  deploy_ci:
    required_in_github_actions:
      - FLY_API_TOKEN
      - NPM_TOKEN
    optional:
      - DOPPLER_TOKEN

integrations_optional:
  coinbase_agentkit:
    - CDP_API_KEY_NAME
    - CDP_API_KEY_PRIVATE_KEY
  browser_widget:
    - WALLETCONNECT_PROJECT_ID

human_gates:
  - Confirm PRIVATE_KEY is a throwaway dev key before any shared environment
  - Fund USDC float wallet separately; do not commit mnemonic/seed
  - Rotate keys after any accidental exposure
  - Mainnet contract deploy requires Security agent sign-off
