name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm test
      - name: Build API image (dry-run)
        run: docker build -f apps/api/Dockerfile -t anyx-api:dry-run .
      - name: Deploy to Fly.io when token is present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set. Image built; skipping flyctl deploy."
            echo "Add the GitHub secret, then re-run this workflow for a live deploy."
            echo "Health check after deploy: curl https://api.anyx.xyz/health"
            exit 0
          fi
          curl -L https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          flyctl deploy --app anyx-api --remote-only || echo "flyctl deploy failed or app not created yet"
