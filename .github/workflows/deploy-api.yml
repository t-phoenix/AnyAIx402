jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Gate — require Dockerfile
        run: |
          if [ ! -f apps/api/Dockerfile ]; then
            echo "apps/api/Dockerfile missing — complete Phase 1 before deploy"
            exit 1
          fi

      - name: Note secrets
        run: |
          echo "Requires repo secrets: FLY_API_TOKEN"
          echo "Requires runtime secrets on Fly: DATABASE_URL, REDIS_URL, PRIVATE_KEY, DEX keys, etc."

