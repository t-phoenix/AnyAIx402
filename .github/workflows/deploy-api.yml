name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4

      # Skipping cleanly beats failing loudly: a fork or a fresh clone has no
      # deploy token and should not show a red X for it.
      - name: Check the deploy prerequisites
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          deployable=true
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice title=Skipped::FLY_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            deployable=false
          fi
          # Checked here rather than mid-deploy: better to not start than to
          # ship code and then discover its migrations cannot run.
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice title=Skipped::DATABASE_URL is not set, and deploying without migrations risks a schema mismatch."
            deployable=false
          fi
          if [ ! -f apps/api/Dockerfile ]; then
            echo "::notice title=Skipped::apps/api/Dockerfile does not exist yet."
            deployable=false
          fi
          echo "deployable=$deployable" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: preflight
    if: needs.preflight.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve the target app
        id: target
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "app=anyx-api" >> "$GITHUB_OUTPUT"
            echo "url=https://api.anyx.xyz/health" >> "$GITHUB_OUTPUT"
          else
            echo "app=anyx-api-staging" >> "$GITHUB_OUTPUT"
            echo "url=https://anyx-api-staging.fly.dev/health" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        run: flyctl deploy --app "${{ steps.target.outputs.app }}" --remote-only

      # A deploy that silently skips migrations can leave the running code
      # ahead of its schema, so a missing DATABASE_URL fails the job rather
      # than passing with a notice.
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error title=No database configured::Add the DATABASE_URL secret. Deploying without running migrations risks a schema mismatch against the code that just shipped."
            exit 1
          fi
          bun install --frozen-lockfile
          bun run db:migrate

      # /health returns 200 even in degraded mode, so a bare status check would
      # pass on a release that cannot persist a receipt. Assert the capability
      # too, not just reachability.
      - name: Health check
        id: health
        run: |
          url="${{ steps.target.outputs.url }}"
          body=""
          for attempt in $(seq 1 30); do
            if body=$(curl -fsS --max-time 10 "$url"); then
              echo "Reachable after ${attempt} attempt(s)."
              break
            fi
            body=""
            sleep 5
          done

          if [ -z "$body" ]; then
            echo "::error title=Health check failed::$url never returned a success response."
            exit 1
          fi

          echo "$body"
          if echo "$body" | grep -q '"persistence":"memory"'; then
            echo "::error title=Deployed in degraded mode::The release is running without a database, so receipts would be lost on restart."
            exit 1
          fi

      - name: Roll back on a failed health check
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "::warning title=Rolling back::The release did not become healthy."
          flyctl releases rollback --app "${{ steps.target.outputs.app }}" --yes
